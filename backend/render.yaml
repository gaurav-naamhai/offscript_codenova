services:
  - type: web
    name: offscript-compliance-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: REPO_BACKEND
        value: memory
      - key: FRONTEND_ORIGIN
        value: "http://localhost:3000"
      - key: DEMO_MODE
        value: "false"
      - key: EXTERNAL_SERVICES_ENABLED
        value: "gemini,exa,tinyfish,supabase"

