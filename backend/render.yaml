services:
  - type: web
    name: offscript-compliance-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: REPO_BACKEND
        value: "memory"
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: EXTERNAL_SERVICES_ENABLED
        value: ""
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: DEMO_MODE
        value: "true"
